<!-- ====== Screen: ログイン ====== -->
<div id="screen-login" class="container hidden">
  <div style="text-align: center; margin: 30px 0 24px;">
    <img src="logo.png" alt="ステップ・アップ" class="brand-logo">
    <div style="font-size: 1.45em; font-weight: 700; color: #1f3864; margin-top: 14px;" data-i18n="appTitle">従業員ポータル</div>
    <div style="font-size: 0.9em; color: #666; margin-top: 4px;">有限会社ステップ・アップ</div>
  </div>

  <div class="card">
    <h2 data-i18n="login">ログイン</h2>
    <div id="login-error" class="error-banner hidden"></div>
    <label class="label" data-i18n="shainNoLabel">社員番号</label>
    <input id="login-shainno" type="number" placeholder="例: 70342" inputmode="numeric">
    <label class="label" data-i18n="birthdayLabel">生年月日</label>
    <input id="login-birthday" type="date">
    <label class="label" data-i18n="telLabel">電話番号 (下4桁)</label>
    <input id="login-tel" type="number" placeholder="例: 1234" inputmode="numeric" maxlength="4">
    <button id="login-btn" class="btn btn-primary" data-i18n="loginButton">ログイン</button>
    <div class="lang-picker" style="text-align: center; margin-top: 14px;">
      <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">🇯🇵 日本語</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 English</button>
      <button type="button" class="lang-btn" data-lang="pt" onclick="setLang('pt')">🇧🇷 Português</button>
    </div>
  </div>
</div>

<!-- ====== Screen: ホームメニュー ====== -->

    <span class="logout-btn" onclick="logout()" data-i18n="logout">ログアウト</span>
  </div>

  <div class="user-card">
    <p class="name" id="home-name">―</p>
    <p class="zairyu-name" id="home-zairyu-name"></p>
    <p class="meta"><span id="home-shainno">―</span> ｜ <span id="home-hakensaki">―</span></p>
  </div>

  <div class="menu-grid">
    <div class="menu-card" onclick="showScreen('request')">
      <span class="card-num">①</span>
      <span class="icon">💴</span>
      <span class="label" data-i18n="menuApply">前払い申請</span>
    </div>
    <div class="menu-card" onclick="showScreen('history')" style="position:relative;">
      <span class="card-num">②</span>
      <span class="icon">📋</span>
      <span class="label" data-i18n="menuHistory">申請履歴</span>
      <span id="history-new-badge" class="new-badge hidden">0</span>
      <span id="history-new-status" class="new-status hidden"></span>
    </div>
    <div class="menu-card coming-soon" onclick="toast(t('comingSoon15'))">
      <span class="card-num">③</span>
      <span class="icon">🪪</span>
      <span class="label" data-i18n="menuZairyu">在留カード更新</span>
    </div>
    <div class="menu-card coming-soon" onclick="toast(t('comingSoonPhase2'))">
      <span class="card-num">④</span>
      <span class="icon">📅</span>
      <span class="label" data-i18n="menuYukyu">有給残数</span>
    </div>
  </div>

  <div class="lang-picker" style="text-align: center; margin-top: 16px;">
    <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">🇯🇵 日本語</button>
    <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 English</button>
    <button type="button" class="lang-btn" data-lang="pt" onclick="setLang('pt')">🇧🇷 Português</button>
  </div>

  <div style="text-align:center; margin-top:14px;">

    <div id="version-tag" class="version-tag"></div>
  </div>
</div>

<!-- ====== Screen: 前払い申請 ====== -->
<div id="screen-request" class="container hidden">
  <div class="header">
    <h1>💴 <span data-i18n="screenApplyTitle">前払い申請</span></h1>
    <span class="logout-btn" onclick="showScreen('home')">✕</span>
  </div>

  <div class="info-banner" data-i18n="applyInfoBanner">
    📌 給料日週・GW・お盆・年末年始は申請できません。希望日は金曜日のみ。
  </div>
  <div id="apply-error" class="error-banner hidden"></div>

  <div class="card">
    <h2>① <span data-i18n="step1">金額を選択</span></h2>
    <div class="amount-grid" id="amount-grid"></div>
  </div>

  <div class="card">
    <h2>② <span data-i18n="step2">希望日 (金曜日のみ)</span></h2>
    <div id="dates-loading" style="text-align:center; padding:20px;"><div class="spinner"></div></div>
    <div id="dates-list"></div>
  </div>

  <div class="card">
    <h2>③ <span data-i18n="step3">理由 (任意)</span></h2>
    <textarea id="apply-reason" placeholder="例: 医療費のため (記入不要)"></textarea>
  </div>

  <button id="apply-submit-btn" class="btn btn-primary" data-i18n="submit">この内容で申請する</button>
  <button class="btn btn-secondary" onclick="showScreen('home')" data-i18n="cancel">キャンセル</button>
</div>

<!-- ====== Screen: 申請履歴 ====== -->
<div id="screen-history" class="container hidden">

    <h1>📋 <span data-i18n="screenHistoryTitle">申請履歴</span></h1>

  <div id="history-loading" style="text-align:center; padding:30px;"><div class="spinner"></div></div>
  <div id="history-list"></div>
  <div id="history-empty" class="card hidden" style="text-align:center; color:#999;" data-i18n="historyEmpty">
    申請はまだありません。
  </div>

  <button class="btn btn-secondary" onclick="showScreen('home')" data-i18n="back">戻る</button>
</div>

<div class="footer">© 2026 有限会社ステップ・アップ</div>

<!-- ====== Loading & Toast ====== -->
<div id="loading" class="loading-overlay hidden"><div class="spinner" style="width:36px; height:36px;"></div></div>

let currentLang = localStorage.getItem("lang") || "ja";
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || I18N.ja[key] || key; }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.documentElement.lang = currentLang;
  // 全 lang-btn に active クラスを付け直し
  document.querySelectorAll('.lang-btn').forEach(btn => {
    if (btn.getAttribute('data-lang') === currentLang) btn.classList.add('active');
    else btn.classList.remove('active');
  });
}
function setLang(lang) {
  if (!['ja', 'en', 'pt'].includes(lang)) return;
  currentLang = lang;
  localStorage.setItem("lang", currentLang);
  applyI18n();
  // Refresh dynamic UI strings
  if (state.profile && !document.getElementById('screen-home').classList.contains('hidden')) {
    renderHome();
  }
  if (!document.getElementById('screen-history').classList.contains('hidden')) {
    renderHistory();
  }
  if (!document.getElementById('screen-request').classList.contains('hidden')) {
    renderAmounts();
    if (state.datesCache) renderDates(state.datesCache);
  }
}

// ====== グローバル状態 ======
const state = {
  token: localStorage.getItem("token") || null,
  profile: null,
  selectedAmount: null,
  selectedDate: null,
  datesCache: null,
  historyCache: null,
};

// ====== API ======
async function callApi(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const opts = { method, headers };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  let data;
  try { data = await res.json(); } catch (e) { data = { error: 'invalid_response' }; }
  if (res.status === 401 && state.token) {
    // トークン期限切れ
    state.token = null;
    state.profile = null;
    localStorage.removeItem("token");
    showScreen('login');
    const err = new Error('unauthorized');
    err.status = 401;
    err.data = data;
    throw err;
  }
  if (!res.ok) {
    const err = new Error(data.error || 'api_error');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('hidden', !show);
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.4s'; }, 2600);
  setTimeout(() => { el.remove(); }, 3100);
}

// ====== 画面遷移 ======
function showScreen(name) {
  ['login','home','request','history'].forEach(s => {
    document.getElementById('screen-' + s).classList.add('hidden');
  });
  document.getElementById('screen-' + name).classList.remove('hidden');
  window.scrollTo(0, 0);
  if (name === 'request') initRequestScreen();
  if (name === 'history') initHistoryScreen();
  if (name === 'home') renderHome();
}

// ====== ログイン ======
async function tryLogin() {
  const shainNo = parseInt(document.getElementById('login-shainno').value, 10);
  const birthday = document.getElementById('login-birthday').value;
  const telLast4 = document.getElementById('login-tel').value;
  const errBox = document.getElementById('login-error');
  errBox.classList.add('hidden');
  if (!shainNo || !birthday || !telLast4) {
    errBox.textContent = t('missingLoginFields');
    errBox.classList.remove('hidden');
    return;
  }
  showLoading(true);
  try {
    const data = await callApi('POST', '/auth/login', {
      shainNo: shainNo, birthday: birthday, telLast4: String(telLast4).slice(-4),
    });
    state.token = data.token;
    state.profile = data.profile;
    localStorage.setItem("token", data.token);
    showScreen('home');
  } catch (e) {
    if (e.status === 429) {
      const remainSec = (e.data && e.data.remainingSeconds) || (30 * 60);
      const remainMin = Math.ceil(remainSec / 60);
      errBox.textContent = t('lockedOut').replace('{min}', remainMin);
    }
    else if (e.status === 401) errBox.textContent = t('authFailed');
    else if (e.status === 403) errBox.textContent = t('notActive');
    else errBox.textContent = t('networkError') + ' (' + (e.data && e.data.detail ? e.data.detail : e.message) + ')';
    errBox.classList.remove('hidden');
  } finally {
    showLoading(false);
  }
}

function logout() {
  if (!confirm(t('logoutConfirm'))) return;
  state.token = null;
  state.profile = null;
  state.datesCache = null;
  state.historyCache = null;
  localStorage.removeItem("token");
  showScreen('login');
}

// ====== ホーム ======
function renderHome() {
  if (!state.profile) return;
  document.getElementById('home-name').textContent = state.profile.name || '―';
  const zn = state.profile.zairyuName || '';
  const znEl = document.getElementById('home-zairyu-name');
  if (zn) { znEl.textContent = zn; znEl.style.display = ''; }
  else { znEl.textContent = ''; znEl.style.display = 'none'; }
  document.getElementById('home-shainno').textContent = 'No. ' + (state.profile.shainNo || '―');
  document.getElementById('home-hakensaki').textContent = state.profile.hakensaki || '―';
  // 未確認の承認/却下件数バッジを更新 (履歴はキャッシュせず鮮度優先)
  state.historyCache = null;
  updateHistoryBadge();
}

async function ensureProfile() {
  if (state.profile) return;
  const data = await callApi('GET', '/profile');
  state.profile = data.profile;
}

// ====== 前払い申請 ======
function renderAmounts() {
  const grid = document.getElementById('amount-grid');
  grid.innerHTML = '';
  AMOUNT_CHOICES.forEach(a => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'amount-btn' + (state.selectedAmount === a ? ' selected' : '');
    btn.textContent = a.toLocaleString() + '円';
    btn.onclick = () => {
      state.selectedAmount = a;
      renderAmounts();
    };
    grid.appendChild(btn);
  });
}

function renderDates(data) {
  const list = document.getElementById('dates-list');
  document.getElementById('dates-loading').classList.add('hidden');
  list.innerHTML = '';
  if (!data || !data.dates) return;
  data.dates.forEach(d => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isSelected = state.selectedDate === d.date;
    btn.className = 'friday-btn' + (d.available ? (isSelected ? ' selected' : '') : ' disabled');
    const dateObj = new Date(d.date + 'T00:00:00');
    const label = dateObj.getFullYear() + '/' + String(dateObj.getMonth()+1).padStart(2,'0') + '/' + String(dateObj.getDate()).padStart(2,'0') + ' (金)';
    const span1 = document.createElement('span'); span1.textContent = label;
    btn.appendChild(span1);
    if (d.reasons && d.reasons.length) {
      const span2 = document.createElement('span'); span2.className = 'reason';
      const reasonText = d.reasons.map(r => r === '給料日週' ? t('salaryWeek') : r === '会社休日' ? t('companyHoliday') : '⚠ ' + r).join(' ');
      span2.textContent = reasonText;
      btn.appendChild(span2);
    }
    if (d.available) {
      btn.onclick = () => {
        state.selectedDate = d.date;
        renderDates(data);
      };
    }
    list.appendChild(btn);
  });
}

async function initRequestScreen() {
  state.selectedAmount = null;
  state.selectedDate = null;
  document.getElementById('apply-error').classList.add('hidden');
  document.getElementById('apply-reason').value = '';
  renderAmounts();
  document.getElementById('dates-loading').classList.remove('hidden');
  document.getElementById('dates-list').innerHTML = '';
  try {
    const data = await callApi('GET', '/maebarai/dates');
    state.datesCache = data;
    renderDates(data);
  } catch (e) {
    document.getElementById('dates-loading').classList.add('hidden');
    document.getElementById('dates-list').innerHTML = '<div class="error-banner">' + t('networkError') + '</div>';
  }
}

async function submitApply() {
  const errBox = document.getElementById('apply-error');
  errBox.classList.add('hidden');
  if (!state.selectedAmount) { errBox.textContent = t('selectAmountFirst'); errBox.classList.remove('hidden'); return; }
  if (!state.selectedDate) { errBox.textContent = t('selectDateFirst'); errBox.classList.remove('hidden'); return; }
  const reason = document.getElementById('apply-reason').value.trim();
  const btn = document.getElementById('apply-submit-btn');
  btn.disabled = true;
  showLoading(true);
  try {
    await callApi('POST', '/maebarai/apply', {
      amount: state.selectedAmount,
      date: state.selectedDate,
      reason: reason,
    });
    toast(t('applySuccess'), 'success');
    state.historyCache = null;
    setTimeout(() => showScreen('history'), 800);
  } catch (e) {
    if (e.status === 409 && e.data && e.data.error === 'duplicate_application') {
      const stKey = 'status' + (e.data.existingStatus || 'pending').charAt(0).toUpperCase() + (e.data.existingStatus || 'pending').slice(1);
      errBox.textContent = t('duplicateApplication').replace('{status}', t(stKey));
    } else {
      errBox.textContent = (e.data && e.data.error) ? (e.data.error + ' ' + (e.data.detail || '')) : t('networkError');
    }
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    showLoading(false);
  }
}

// 申請取消 (pending のみ)
async function cancelApply(id) {
  if (!confirm(t('cancelConfirm'))) return;
  showLoading(true);
  try {
    await callApi('POST', '/maebarai/cancel', { id: id });
    toast(t('cancelSuccess'), 'success');
    state.historyCache = null;
    await initHistoryScreen();
  } catch (e) {
    toast(t('cancelError') + ' ' + (e.data && e.data.error ? e.data.error : ''), 'error');
  } finally {
    showLoading(false);
  }
}

// ====== 申請履歴 ======
function renderHistory() {
  const list = document.getElementById('history-list');
  const empty = document.getElementById('history-empty');
  document.getElementById('history-loading').classList.add('hidden');
  list.innerHTML = '';
  const items = (state.historyCache && state.historyCache.items) || [];
  if (items.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  items.forEach(it => {
    const status = (it.status || 'pending').toLowerCase();
    const item = document.createElement('div');
    item.className = 'history-item ' + status;
    const row1 = document.createElement('div'); row1.className = 'row1';
    const amount = document.createElement('span'); amount.className = 'amount'; amount.textContent = '¥' + Number(it.amount || 0).toLocaleString();
    const badge = document.createElement('span'); badge.className = 'status-badge status-' + status;
    badge.textContent = t('status' + status.charAt(0).toUpperCase() + status.slice(1));
    row1.append(amount, badge);
    item.append(row1);
    const meta = document.createElement('div'); meta.className = 'meta';
    let mtext = t('kibobi') + ': ' + (it.date || '―');
    if (it.createdAt) mtext += ' ｜ ' + t('appliedAt') + ': ' + it.createdAt;
    if (status === 'approved' && it.approvedAt) mtext += ' ｜ ' + t('approvedAt') + ': ' + it.approvedAt;
    meta.textContent = mtext;
    item.append(meta);
    if (status === 'rejected' && it.rejectReason) {
      const rr = document.createElement('div'); rr.className = 'reject-reason';
      rr.textContent = '📝 ' + t('rejectReason') + ': ' + it.rejectReason;
      item.append(rr);
    }
    if (status === 'pending') {
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-cancel-apply';
      cancelBtn.textContent = '✕ ' + t('cancelButton');
      cancelBtn.onclick = () => cancelApply(it.id);
      item.append(cancelBtn);
    }
    list.appendChild(item);
  });
}

// 確認済み ID の管理 (id → "approved" | "rejected") を localStorage に保存
function getSeenStatusMap() {
  try {
    const raw = localStorage.getItem('seenHistoryStatus');
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function markHistoryAsSeen(items) {
  // approved/rejected の {id: status} を記録 (履歴画面を開いた瞬間 = 確認した瞬間)
  const map = getSeenStatusMap();
  (items || []).forEach(it => {
    const st = (it.status || '').toLowerCase();
    if (st === 'approved' || st === 'rejected') {
      map[String(it.id)] = st;
    }
  });
  try { localStorage.setItem('seenHistoryStatus', JSON.stringify(map)); } catch (e) {}
}

async function initHistoryScreen() {
  document.getElementById('history-loading').classList.remove('hidden');
  document.getElementById('history-list').innerHTML = '';
  document.getElementById('history-empty').classList.add('hidden');
  try {
    const data = await callApi('GET', '/maebarai/history');
    state.historyCache = data;
    renderHistory();
    // 履歴画面を開いた瞬間に「現在の承認/却下済み件」を全部「確認済み」として記録
    markHistoryAsSeen(data.items || []);
    updateHistoryBadge();  // 即時クリア表示
  } catch (e) {
    document.getElementById('history-loading').classList.add('hidden');
    toast(t('networkError') + ' (' + (e.message || '') + ')', 'error');
  }
}

// ホーム画面で「未確認の承認/却下件数」をバッジ表示
async function updateHistoryBadge() {
  const badge = document.getElementById('history-new-badge');
  const status = document.getElementById('history-new-status');
  if (!badge || !status) return;
  try {
    // 履歴を取得 (キャッシュがあれば再利用、なければフェッチ)
    let items;
    if (state.historyCache && state.historyCache.items) {
      items = state.historyCache.items;
    } else {
      const data = await callApi('GET', '/maebarai/history');
      state.historyCache = data;
      items = data.items || [];
    }
    const seenMap = getSeenStatusMap();
    let approvedNew = 0, rejectedNew = 0;
    items.forEach(it => {
      const st = (it.status || '').toLowerCase();
      if (st !== 'approved' && st !== 'rejected') return;
      const key = String(it.id);
      // 確認済みマップで「同じ status」で記録されていれば「既読」、そうでなければ「未読」
      if (seenMap[key] === st) return;  // 既読
      if (st === 'approved') approvedNew++;
      else rejectedNew++;
    });
    const total = approvedNew + rejectedNew;
    if (total > 0) {
      badge.textContent = String(total);
      badge.classList.remove('hidden');
      if (approvedNew > 0 && rejectedNew > 0) {
        status.textContent = '✓' + approvedNew + ' ✗' + rejectedNew;
        status.className = 'new-status both';
      } else if (approvedNew > 0) {
        status.textContent = '✓ ' + t('statusApproved');
        status.className = 'new-status approved';
      } else {
        status.textContent = '✗ ' + t('statusRejected');
        status.className = 'new-status rejected';
      }
      status.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
      status.classList.add('hidden');
    }
  } catch (e) { /* silent */ }
}

// ====== Service Worker (PWA) ======
const APP_VERSION = 'v9';  // commit hash や日付に置き換え可能。バンプすると Service Worker が更新を検知
let _swRegistration = null;
let _swUpdateAvailable = false;

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    _swRegistration = await navigator.serviceWorker.register('service-worker.js');
    // 新しい SW が waiting 状態になったら通知
    if (_swRegistration.waiting) markUpdateAvailable();
    _swRegistration.addEventListener('updatefound', () => {
      const nw = _swRegistration.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          markUpdateAvailable();
        }
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // 新 SW がアクティブ化されたらリロード
      if (window._reloadAfterUpdate) window.location.reload();
    });
  } catch (e) { console.warn('SW register error:', e); }
}

function markUpdateAvailable() {
  _swUpdateAvailable = true;
  const btn = document.getElementById('check-update-btn');
  if (btn) {
    btn.classList.add('has-update');
    btn.textContent = t('updateAvailable');
  }
}

async function checkUpdate() {
  const btn = document.getElementById('check-update-btn');
  const verEl = document.getElementById('version-tag');
  if (btn) btn.textContent = t('updating');
  // SW の登録があれば更新チェック
  if (_swRegistration) {
    try { await _swRegistration.update(); } catch (e) {}
  }
  // waiting 状態の SW があれば即時切替
  if (_swRegistration && _swRegistration.waiting) {
    window._reloadAfterUpdate = true;
    _swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
    return;
  }
  // 強制リロード (キャッシュバイパス)
  try {
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names.map(n => caches.delete(n)));
    }
  } catch (e) {}
  // 数秒待って SW 検知に時間を与える
  setTimeout(() => {
    if (_swUpdateAvailable) return;  // 更新があった場合は markUpdateAvailable() でUI更新済み
    if (btn) {
      btn.textContent = t('updateNone');
      setTimeout(() => { btn.textContent = t('checkUpdate'); btn.classList.remove('has-update'); }, 2000);
    }
    // 強制リロードしておく (キャッシュが古い場合に最新を取りに行く)
    window.location.reload();
  }, 1500);
}

// ====== Init ======
async function bootstrap() {
  applyI18n();
  document.getElementById('login-btn').addEventListener('click', tryLogin);
  document.getElementById('apply-submit-btn').addEventListener('click', submitApply);
  // バージョン表示 (任意)
  const verEl = document.getElementById('version-tag');
  if (verEl) verEl.textContent = 'Build: ' + APP_VERSION;
  // Service Worker 登録 (PWA: スマホホーム画面に追加可能化 + オフラインキャッシュ)
  registerServiceWorker();
  if (state.token) {
    showLoading(true);
    try {
      await ensureProfile();
      showScreen('home');
    } catch (e) {
      showScreen('login');
    } finally {
      showLoading(false);
    }
  } else {
    showScreen('login');
  }
}

bootstrap();
