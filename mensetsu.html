<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex">
<title>面接シート | STEP・UP</title>
<style>
:root { --p:#5e35b1; --pl:#7c4dff; --bg:#f4f4f8; --line:#cbd5e1; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Hiragino Sans','Yu Gothic',Meiryo,sans-serif; background:var(--bg); color:#1e293b; }
.wrap { max-width:520px; margin:0 auto; padding:14px 14px 60px; }
.hero { position:relative; background:linear-gradient(135deg,#7c4dff 0%,#5e35b1 55%,#4527a0 100%);
  border-radius:20px; padding:26px 18px 22px; margin:4px 0 14px; text-align:center; color:#fff;
  box-shadow:0 8px 24px rgba(94,53,177,.35); overflow:hidden; }
.hero::before { content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px;
  border-radius:50%; background:rgba(255,255,255,.08); }
.hero::after { content:''; position:absolute; bottom:-60px; left:-30px; width:140px; height:140px;
  border-radius:50%; background:rgba(255,255,255,.07); }
.hero .emblem { width:64px; height:64px; border-radius:16px; background:#fff; padding:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.25); }
.hero h1 { margin:10px 0 4px; font-size:22px; letter-spacing:.06em; font-weight:800; }
.hero .sub { margin:0; font-size:12.5px; opacity:.92; letter-spacing:.04em; }
.hero .brand { margin-top:8px; font-size:11px; opacity:.8; letter-spacing:.18em; font-weight:700; }
.langbar { display:flex; gap:7px; justify-content:center; margin:0 0 14px; }
.langbar button { flex:1; max-width:130px; padding:9px 6px; border-radius:22px; border:2px solid var(--p); background:#fff; color:var(--p); font-weight:800; font-size:13.5px; }
.langbar button.on { background:var(--p); color:#fff; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,.04); }
.card h2 { margin:0 0 10px; font-size:14.5px; color:var(--p); border-left:4px solid var(--pl); padding-left:8px; }
label.fl { display:block; font-size:11.5px; color:#64748b; font-weight:700; margin:10px 0 3px; }
label.fl .req { color:#e53935; }
input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], select {
  width:100%; padding:11px 10px; font-size:16px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
.btnrow { display:flex; flex-wrap:wrap; gap:7px; }
.btnrow button { flex:1; min-width:70px; padding:10px 4px; font-size:14px; font-weight:700; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:#334155; }
.btnrow button.on { background:var(--p); color:#fff; border-color:var(--p); }
.chiprow { display:flex; flex-wrap:wrap; gap:7px; }
.chiprow button { padding:9px 14px; font-size:14px; font-weight:700; border:1.5px solid var(--line); border-radius:18px; background:#fff; color:#334155; }
.chiprow button.on { background:var(--pl); color:#fff; border-color:var(--pl); }
.jobcard { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:10px 12px; margin-bottom:10px; position:relative; }
.jobcard .jtitle { font-size:12.5px; font-weight:800; color:var(--p); }
.jobdel { position:absolute; top:8px; right:10px; background:none; border:none; color:#94a3b8; font-size:16px; }
.addjob { width:100%; padding:11px; border:2px dashed var(--pl); border-radius:12px; background:#faf5ff; color:var(--p); font-weight:800; font-size:14px; }
.submit { width:100%; margin-top:14px; padding:16px; font-size:17px; font-weight:800; color:#fff; border:none; border-radius:14px;
  background:linear-gradient(135deg,var(--pl),var(--p)); box-shadow:0 4px 14px rgba(94,53,177,.35); }
.err { color:#c62828; font-size:13px; font-weight:700; margin-top:8px; display:none; }
.zip-hint { font-size:12px; color:#0f766e; margin-top:4px; min-height:16px; }
.row2 { display:flex; gap:8px; }
.row2 > div { flex:1; min-width:0; }
#done { display:none; text-align:center; padding:60px 20px; }
#done .big { font-size:52px; }
#done h2 { color:var(--p); }
</style>
</head>
<body>
<div class="wrap" id="formWrap">
  <div class="hero">
    <img class="emblem" src="emblem.png" alt="" onerror="this.style.display='none'">
    <h1 data-t="title">面接シート</h1>
    <p class="sub" data-t="sub">下の項目を入力してください</p>
    <div class="brand">STEP・UP　有限会社ステップ・アップ</div>
  </div>
  <div class="langbar">
    <button id="langJa" class="on" onclick="setLang('ja')">日本語</button>
    <button id="langPt" onclick="setLang('pt')">Português</button>
    <button id="langEn" onclick="setLang('en')">English</button>
  </div>

  <div class="card">
    <h2 data-t="s1">1. 基本情報</h2>
    <label class="fl"><span data-t="name">名前（カタカナ または ローマ字）</span> <span class="req">*</span></label>
    <input type="text" id="f_name" autocomplete="name">
    <div class="row2">
      <div style="flex:1.6;">
        <label class="fl"><span data-t="birth">生年月日</span> <span class="req">*</span></label>
        <div class="row2">
          <div><select id="f_birth_y"></select></div>
          <div><select id="f_birth_m"></select></div>
          <div><select id="f_birth_d"></select></div>
        </div>
      </div>
      <div>
        <label class="fl" data-t="sex">性別</label>
        <div class="btnrow" id="g_sex"></div>
      </div>
    </div>
    <div class="row2">
      <div>
        <label class="fl" data-t="marital">婚姻状況</label>
        <div class="btnrow" id="g_marital"></div>
      </div>
      <div>
        <label class="fl" data-t="nat">国籍</label>
        <select id="f_nationality"></select>
      </div>
    </div>
    <div class="row2">
      <div>
        <label class="fl" data-t="gakureki">最終学歴</label>
        <select id="f_gakureki"></select>
      </div>
      <div>
        <label class="fl" data-t="schoolCountry">学校の国</label>
        <select id="f_schoolCountry"></select>
      </div>
    </div>
    <label class="fl"><span data-t="tel">電話番号</span> <span class="req">*</span></label>
    <input type="tel" id="f_tel" inputmode="tel" placeholder="090-0000-0000">
    <label class="fl" data-t="mail">メールアドレス</label>
    <input type="email" id="f_mail" inputmode="email">
    <label class="fl" data-t="emg">緊急連絡先（名前と電話）</label>
    <input type="text" id="f_emergency" placeholder="例: ハナコ 090-1111-2222">
    <input type="text" id="company_hp" style="display:none" tabindex="-1" autocomplete="off">
  </div>

  <div class="card">
    <h2 data-t="s2">2. 住所</h2>
    <label class="fl" data-t="cityPick">住んでいる市・区をタップしてください</label>
    <div class="chiprow" id="g_city" style="margin-bottom:4px;"></div>
    <label class="fl"><span data-t="addr">住所（続けて町名を入力・番地は不要）</span> <span class="req">*</span></label>
    <input type="text" id="f_addr" placeholder="浜松市中央区○○町">
    <label class="fl" data-t="zip">郵便番号（わかる場合のみ・入れると住所が自動で入ります）</label>
    <input type="tel" id="f_zip" inputmode="numeric" maxlength="8" placeholder="4300000" oninput="zipLookup()">
    <div class="zip-hint" id="zipHint"></div>
  </div>

  <div class="card">
    <h2 data-t="s3">3. 在留資格・日本語</h2>
    <div id="zairyuBlock">
      <label class="fl" data-t="zairyu">在留資格（外国籍の方のみ）</label>
      <select id="f_zairyu"></select>
    </div>
    <label class="fl" data-t="rikai">日本語を理解する</label>
    <div class="btnrow" id="g_jpRikai"></div>
    <label class="fl" data-t="hanasu">日本語を話す</label>
    <div class="btnrow" id="g_jpHanasu"></div>
    <label class="fl" data-t="pct">日本語 どのくらい？（％）</label>
    <div class="btnrow" id="g_jpPct"></div>
    <label class="fl" data-t="yomeru">読める（複数選択可）</label>
    <div class="chiprow" id="g_yomeru"></div>
    <label class="fl" data-t="kakeru">書ける（複数選択可）</label>
    <div class="chiprow" id="g_kakeru"></div>
  </div>

  <div class="card">
    <h2 data-t="s4">4. 職歴（新しい順・最大4件）</h2>
    <div id="jobs"></div>
    <button type="button" class="addjob" onclick="addJob()" id="addJobBtn">＋ <span data-t="addjob">職歴を追加</span></button>
  </div>

  <div class="card">
    <h2 data-t="s5">5. 希望条件</h2>
    <label class="fl" data-t="zangyo">残業</label>
    <div class="btnrow" id="g_zangyo"></div>
    <label class="fl" data-t="sat">土曜日（休日出勤）</label>
    <div class="btnrow" id="g_sat"></div>
    <label class="fl" data-t="kotai">交代勤務</label>
    <div class="btnrow" id="g_kotai"></div>
    <label class="fl" data-t="commute">通勤手段</label>
    <div class="btnrow" id="g_commute"></div>
    <label class="fl" data-t="online">オンライン面接の方法</label>
    <div class="row2">
      <div><select id="f_online"></select></div>
      <div><input type="text" id="f_onlineId" placeholder="ID / 番号"></div>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s6">6. 免許・資格・サイズ</h2>
    <label class="fl" data-t="lic">運転免許</label>
    <select id="f_license"></select>
    <label class="fl" data-t="licExp">免許証有効期限</label>
    <div class="row2">
      <div><select id="f_lic_y"></select></div>
      <div><select id="f_lic_m"></select></div>
      <div><select id="f_lic_d"></select></div>
    </div>
    <label class="fl" data-t="shikaku">資格（複数選択可）</label>
    <div class="chiprow" id="g_shikaku"></div>
    <label class="fl" data-t="shikakuFree">その他の資格（自由入力）</label>
    <input type="text" id="f_shikakuFree">
    <div class="row2">
      <div>
        <label class="fl" data-t="uni">作業服サイズ</label>
        <select id="f_uniform"></select>
      </div>
      <div>
        <label class="fl" data-t="shoes">靴のサイズ</label>
        <select id="f_shoes"></select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s7">7. 面接担当者</h2>
    <p style="font-size:12px;color:#64748b;margin:0 0 6px;" data-t="tantouHint">スタッフに聞いて選んでください</p>
    <select id="f_tantou">
      <option value="">-</option>
      <option>城かおり</option>
      <option>吉浦マルセロ</option>
      <option>森ゆうじ</option>
    </select>
  </div>

  <div class="card" style="background:#fbfaff;border-color:#d9ccf5;">
    <h2 data-t="s8">8. 個人情報の取り扱いについて</h2>
    <p id="privacyText" style="font-size:12px;color:#475569;line-height:1.7;margin:0 0 10px;"></p>
    <label style="display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:800;color:var(--p);cursor:pointer;">
      <input type="checkbox" id="f_agree" style="width:22px;height:22px;accent-color:var(--p);">
      <span data-t="agree">同意します</span>
    </label>
  </div>

  <div class="err" id="errBox"></div>
  <button class="submit" id="submitBtn" onclick="submitForm()" data-t="send">送信する</button>
</div>

<div id="done" class="wrap">
  <div class="big">✅</div>
  <h2 data-t="doneTitle">送信しました！</h2>
  <p data-t="doneBody">スタッフにお声がけください。</p>
</div>

<script>

var picked = {};
var multi = { yomeru: [], kakeru: [], shikaku: [] };

function t(key) { return (T[key] || {})[LANG] || (T[key] || {}).ja || ''; }
function optLabel(o) { return LANG === 'pt' ? o[2] : (LANG === 'en' ? (o[3] || o[1]) : o[1]); }

function setLang(l) {
  LANG = l;
  document.getElementById('langJa').className = (l === 'ja') ? 'on' : '';
  document.getElementById('langPt').className = (l === 'pt') ? 'on' : '';
  document.getElementById('langEn').className = (l === 'en') ? 'on' : '';
  document.querySelectorAll('[data-t]').forEach(function(el) {
    var k = el.getAttribute('data-t');
    if (T[k]) el.textContent = t(k);
  });
  buildAll();
  relabelJobs();
}

function buildBtnGroup(id, optKey, group) {
  var box = document.getElementById(id);
  if (!box) return;
  box.innerHTML = '';
  OPT[optKey].forEach(function(o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = optLabel(o);
    b.className = (picked[group] === o[0]) ? 'on' : '';
    b.onclick = function() {
      picked[group] = (picked[group] === o[0]) ? '' : o[0];
      buildBtnGroup(id, optKey, group);
    };
    box.appendChild(b);
  });
}

function buildChips(id, optKey, group) {
  var box = document.getElementById(id);
  if (!box) return;
  box.innerHTML = '';
  OPT[optKey].forEach(function(o) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = optLabel(o);
    b.className = (multi[group].indexOf(o[0]) >= 0) ? 'on' : '';
    b.onclick = function() {
      var i = multi[group].indexOf(o[0]);
      if (i >= 0) multi[group].splice(i, 1); else multi[group].push(o[0]);
      buildChips(id, optKey, group);
    };
    box.appendChild(b);
  });
}

function buildSelect(id, optKey) {
  var sel = document.getElementById(id);
  if (!sel) return;
  var cur = sel.dataset.val || '';
  sel.innerHTML = '<option value="">-</option>';
  OPT[optKey].forEach(function(o) {
    var op = document.createElement('option');
    op.value = o[0];
    op.textContent = optLabel(o);
    sel.appendChild(op);
  });
  sel.value = cur;
  if (cur && sel.value !== cur) {   // その他で追加した自由入力値
    var op = document.createElement('option');
    op.value = cur;
    op.textContent = cur;
    sel.appendChild(op);
    sel.value = cur;
  }
  sel.onchange = function() {
    if (sel.value === '__other__') {
      var v = prompt(t('other'));
      if (v && v.trim()) {
        var op = document.createElement('option');
        op.value = v.trim();
        op.textContent = v.trim();
        sel.appendChild(op);
        sel.value = v.trim();
      } else {
        sel.value = '';
      }
    }
    sel.dataset.val = sel.value;
  };
}

// 時給プルダウン: 1,100円以下 → 50円刻み → 1,600円以上
function jikyuOptions() {
  var h = '<option value="">-</option><option value="1100円以下">〜1,100円以下</option>';
  for (var v = 1150; v <= 1550; v += 50) {
    h += '<option value="' + v + '円">' + v.toLocaleString('ja-JP') + '円</option>';
  }
  h += '<option value="1600円以上">1,600円以上〜</option>';
  return h;
}

var jobCount = 0;
function addJob() {
  if (jobCount >= 4) return;
  jobCount++;
  var i = jobCount;
  var div = document.createElement('div');
  div.className = 'jobcard';
  div.id = 'job' + i;
  var years = '';
  for (var y = 0; y <= 30; y++) years += '<option value="' + y + '">' + y + '</option>';
  var months = '';
  for (var m = 0; m <= 11; m++) months += '<option value="' + m + '">' + m + '</option>';
  div.innerHTML = '<div class="jtitle" id="j' + i + '_title">🏭 ' + t('jobN') + ' ' + i + '</div>'
    + (i > 1 ? '<button type="button" class="jobdel" onclick="delJob(' + i + ')">✕</button>' : '')
    + '<label class="fl" data-jt="jcompany">' + t('jcompany') + '</label><input type="text" id="j' + i + '_company">'
    + '<div class="row2"><div><label class="fl" data-jt="jhaken">' + t('jhaken') + '</label><input type="text" id="j' + i + '_haken"></div>'
    + '<div><label class="fl" data-jt="jjikyu">' + t('jjikyu') + '</label><select id="j' + i + '_jikyu">' + jikyuOptions() + '</select></div></div>'
    + '<div class="row2"><div><label class="fl" data-jt="jshoku">' + t('jshoku') + '</label><select id="j' + i + '_shokushu"></select></div>'
    + '<div><label class="fl" data-jt="jnaiyou">' + t('jnaiyou') + '</label><select id="j' + i + '_naiyou"></select></div></div>'
    + '<label class="fl" data-jt="jkikan">' + t('jkikan') + '</label>'
    + '<div class="row2"><div><select id="j' + i + '_ky">' + years + '</select></div><div style="align-self:center;flex:0 0 auto;font-size:13px;" data-jt="years">' + t('years') + '</div>'
    + '<div><select id="j' + i + '_km">' + months + '</select></div><div style="align-self:center;flex:0 0 auto;font-size:13px;" data-jt="months">' + t('months') + '</div></div>'
    + '<label class="fl" data-jt="jriyuu">' + t('jriyuu') + '</label><input type="text" id="j' + i + '_riyuu">';
  document.getElementById('jobs').appendChild(div);
  buildSelect('j' + i + '_shokushu', 'shokushu');
  buildSelect('j' + i + '_naiyou', 'naiyou');
  if (jobCount >= 4) document.getElementById('addJobBtn').style.display = 'none';
}
function delJob(i) {
  var el = document.getElementById('job' + i);
  if (el) el.remove();
}
function relabelJobs() {
  document.querySelectorAll('[data-jt]').forEach(function(el) {
    var k = el.getAttribute('data-jt');
    if (T[k]) el.textContent = t(k);
  });
  for (var i = 1; i <= 4; i++) {
    var tt = document.getElementById('j' + i + '_title');
    if (tt) tt.textContent = '🏭 ' + t('jobN') + ' ' + i;
  }
}

// 年月日プルダウン (生年月日/免許証有効期限)
function fillDateSelect(id, ph, from, to, step) {
  var sel = document.getElementById(id);
  if (!sel) return;
  if (sel.options.length > 1) {   // 構築済み→プレースホルダーの言語だけ更新
    sel.options[0].textContent = ph;
    return;
  }
  sel.innerHTML = '';
  var op0 = document.createElement('option');
  op0.value = '';
  op0.textContent = ph;
  sel.appendChild(op0);
  for (var v = from; (step > 0 ? v <= to : v >= to); v += step) {
    var op = document.createElement('option');
    op.value = String(v);
    op.textContent = String(v);
    sel.appendChild(op);
  }
}
function buildDateSelects() {
  var thisYear = new Date().getFullYear();
  fillDateSelect('f_birth_y', t('phYear'), thisYear - 16, 1940, -1);
  fillDateSelect('f_birth_m', t('phMonth'), 1, 12, 1);
  fillDateSelect('f_birth_d', t('phDay'), 1, 31, 1);
  fillDateSelect('f_lic_y', t('phYear'), thisYear, thisYear + 16, 1);
  fillDateSelect('f_lic_m', t('phMonth'), 1, 12, 1);
  fillDateSelect('f_lic_d', t('phDay'), 1, 31, 1);
}
function dateVal(py, pm, pd) {
  var y = val(py), m = val(pm), d = val(pd);
  if (!y || !m || !d) return '';
  return y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2);
}

// 市・区のワンタップ選択 → 住所欄の先頭にセット
var CITIES = ['浜松市中央区', '浜松市浜名区', '浜松市天竜区', '磐田市', '袋井市', '掛川市', '湖西市'];
function buildCityChips() {
  var box = document.getElementById('g_city');
  if (!box) return;
  box.innerHTML = '';
  CITIES.forEach(function(c) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = c;
    var cur = (document.getElementById('f_addr') || { value: '' }).value;
    b.className = (cur.indexOf(c) === 0) ? 'on' : '';
    b.onclick = function() {
      var ad = document.getElementById('f_addr');
      var rest = ad.value;
      CITIES.forEach(function(x) { if (rest.indexOf(x) === 0) rest = rest.slice(x.length); });
      ad.value = c + rest;
      buildCityChips();
      ad.focus();
    };
    box.appendChild(b);
  });
}

    natSel.dataset.zhook = '1';

      var zb = document.getElementById('zairyuBlock');
      if (zb) zb.style.display = (natSel.value === '日本') ? 'none' : '';
    });
  }
  // 個人情報テキスト
  var pv = document.getElementById('privacyText');
  if (pv) pv.textContent = t('privacy');
  for (var i = 1; i <= 4; i++) {
    if (document.getElementById('j' + i + '_shokushu')) {

// 郵便番号 → 住所 (zipcloud)
async function zipLookup() {
  var z = document.getElementById('f_zip').value.replace(/[^0-9]/g, '');
  if (z.length !== 7) return;
  try {
    var r = await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + z);
    var d = await r.json();
    if (d.results && d.results[0]) {
      var a = d.results[0];
      document.getElementById('f_addr').value = (a.address1 || '') + (a.address2 || '') + (a.address3 || '');
      document.getElementById('zipHint').textContent = '✔ ' + a.address1 + a.address2 + a.address3;
      buildCityChips();
    }
  } catch (e) {}
}

function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

async function submitForm() {
  var err = document.getElementById('errBox');
  err.style.display = 'none';
  var name = val('f_name'), tel = val('f_tel'), addr = val('f_addr');
  var birth = dateVal('f_birth_y', 'f_birth_m', 'f_birth_d');
  var agree = document.getElementById('f_agree');
  var msg = !name ? t('needName') : (!tel ? t('needTel') : (!birth ? t('needBirth') : (!addr ? t('needAddr')
    : (!(agree && agree.checked) ? t('needAgree') : ''))));
  if (msg) {
    err.textContent = '⚠ ' + msg;
    err.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  var jobs = [];
  for (var i = 1; i <= 4; i++) {
    if (!document.getElementById('job' + i)) continue;
    var ky = Number(val('j' + i + '_ky') || 0), km = Number(val('j' + i + '_km') || 0);
    var kikan = (ky ? ky + '年' : '') + (km ? km + 'ヶ月' : '');
    var haken = val('j' + i + '_haken');
    var jikyu = val('j' + i + '_jikyu');
    if (jikyu) haken = (haken ? haken + ' ' : '') + '時給' + jikyu;
    var jb = { company: val('j' + i + '_company'), haken: haken,
               shokushu: val('j' + i + '_shokushu'), naiyou: val('j' + i + '_naiyou'),
               kikan: kikan, riyuu: val('j' + i + '_riyuu') };
    if (jb.company || jb.shokushu || jb.naiyou || kikan) jobs.push(jb);
  }
  // 学歴: レベル + 学校の国 を結合 (例: 高校卒業（ブラジルの学校）)
  var gk = val('f_gakureki');
  var gc = val('f_schoolCountry');
  var gakureki = gk ? (gc ? gk + '（' + gc + 'の学校）' : gk) : '';
  // 免許 + 資格を結合して保存 (スキルシートの資格欄にそのまま出る)
  var licParts = [];
  if (val('f_license') && val('f_license') !== 'なし') licParts.push(val('f_license'));
  multi.shikaku.forEach(function(s) { licParts.push(s); });
  if (val('f_shikakuFree')) licParts.push(val('f_shikakuFree'));
  var license = licParts.join('・') || val('f_license');
  // オンライン面接: 方法 + ID
  var online = val('f_online');
  if (online && val('f_onlineId')) online += ': ' + val('f_onlineId');
  var zairyuVal = (val('f_nationality') === '日本') ? '日本国籍' : val('f_zairyu');
  var body = {
    name: name, tel: tel, addr: addr, birth: birth,
    mail: val('f_mail'), emergency: val('f_emergency'),
    sex: picked.sex || '', marital: picked.marital || '',
    nationality: val('f_nationality'), zairyu: zairyuVal,
    gakureki: gakureki, online: online,
    jpRikai: picked.jpRikai || '', jpHanasu: picked.jpHanasu || '', jpPct: picked.jpPct || '',
    yomeru: multi.yomeru, kakeru: multi.kakeru,
    zangyo: picked.zangyo || '', sat: picked.sat || '', kotai: picked.kotai || '',
    commute: picked.commute || '', license: license,
    licenseExp: dateVal('f_lic_y', 'f_lic_m', 'f_lic_d'),
    uniform: val('f_uniform'), shoes: val('f_shoes'),
    tantou: val('f_tantou'), jobs: jobs, lang: LANG,
    company_hp: val('company_hp')
  };
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = t('sending');
  try {
    var resp = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify(body) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    document.getElementById('formWrap').style.display = 'none';
    var dn = document.getElementById('done');
    dn.style.display = 'block';
    dn.querySelector('[data-t="doneTitle"]').textContent = t('doneTitle');
    dn.querySelector('[data-t="doneBody"]').textContent = t('doneBody');
    window.scrollTo(0, 0);
  } catch (e) {
    err.textContent = '⚠ ' + t('sendFail');
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = t('send');
  }
}
